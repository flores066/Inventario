<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Less Perfum — Crear cuenta</title>
  <link rel="stylesheet" href="register.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- PANEL VISUAL -->
  <div class="split-visual">
    <div class="visual-overlay"></div>
    <img
      src="https://images.unsplash.com/photo-1623293182086-7651a899d37f?w=1200&h=1600&fit=crop"
      alt="Fragancia de nicho" class="visual-img">
    <div class="visual-content">
      <a href="../index.html" class="brand-logo">Less <span>Perfum</span></a>
      <div class="visual-perks">
        <p class="perks-title">Ventajas de tu cuenta</p>
        <ul class="perks-list">
          <li><i class="bi bi-bag-heart"></i> Guarda tus fragancias favoritas</li>
          <li><i class="bi bi-truck"></i> Seguimiento de tus pedidos</li>
          <li><i class="bi bi-percent"></i> Acceso a ofertas exclusivas</li>
          <li><i class="bi bi-stars"></i> Puntos por cada compra</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- PANEL FORMULARIO -->
  <div class="split-form">
    <div class="form-container">

      <div class="form-header">
        <p class="form-label">Únete a nosotros</p>
        <h1 class="form-title">Crear cuenta</h1>
        <p class="form-sub">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
      </div>

      <form class="auth-form" id="registerForm" novalidate>

        <div class="fields-row">
          <div class="field-group">
            <label for="firstName">Nombre</label>
            <div class="input-wrap">
              <i class="bi bi-person input-icon"></i>
              <input type="text" id="firstName" name="firstName" placeholder="Sofía" autocomplete="given-name">
            </div>
            <span class="field-error" id="firstNameErr"></span>
          </div>
          <div class="field-group">
            <label for="lastName">Apellido</label>
            <div class="input-wrap">
              <input type="text" id="lastName" name="lastName" placeholder="Torres" autocomplete="family-name" style="padding-left:0.9rem;">
            </div>
            <span class="field-error" id="lastNameErr"></span>
          </div>
        </div>

        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email">
          </div>
          <span class="field-error" id="emailErr"></span>
        </div>

        <div class="field-group">
          <label for="phone">Teléfono <span class="optional">(opcional)</span></label>
          <div class="input-wrap">
            <i class="bi bi-telephone input-icon"></i>
            <input type="tel" id="phone" name="phone" placeholder="+57 300 000 0000" autocomplete="tel">
          </div>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
            <button type="button" class="toggle-pass" id="togglePass" tabindex="-1">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
          <div class="strength-bar" id="strengthBar">
            <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
            <span class="strength-label" id="strengthLabel"></span>
          </div>
          <span class="field-error" id="passErr"></span>
        </div>

        <div class="field-group">
          <label for="passConfirm">Confirmar contraseña</label>
          <div class="input-wrap">
            <i class="bi bi-lock-fill input-icon"></i>
            <input type="password" id="passConfirm" name="passConfirm" placeholder="Repite tu contraseña" autocomplete="new-password">
            <button type="button" class="toggle-pass" id="togglePass2" tabindex="-1">
              <i class="bi bi-eye" id="eyeIcon2"></i>
            </button>
          </div>
          <span class="field-error" id="confirmErr"></span>
        </div>

        <div class="field-group">
          <label class="checkbox-label">
            <input type="checkbox" id="terms">
            <span class="checkmark"></span>
            Acepto los <a href="#">Términos y condiciones</a> y la <a href="#">Política de privacidad</a>
          </label>
          <span class="field-error" id="termsErr"></span>
        </div>

        <label class="checkbox-label newsletter-check">
          <input type="checkbox" id="newsletter" checked>
          <span class="checkmark"></span>
          Quiero recibir ofertas exclusivas por correo
        </label>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">Crear mi cuenta</span>
          <i class="bi bi-arrow-right btn-arrow"></i>
        </button>

      </form>

      <div class="divider"><span>o regístrate con</span></div>

      <div class="social-btns">
        <button class="btn-social">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button class="btn-social">
          <i class="bi bi-facebook" style="color:#1877F2;font-size:1.1rem;"></i>
          Facebook
        </button>
      </div>

    </div>
  </div>

  <script>
    // Toggle passwords
    function makeToggle(btnId, inputId, iconId) {
      document.getElementById(btnId).addEventListener('click', function () {
        const inp  = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        inp.type  = inp.type === 'password' ? 'text' : 'password';
        icon.className = inp.type === 'text' ? 'bi bi-eye-slash' : 'bi bi-eye';
      });
    }
    makeToggle('togglePass',  'password',    'eyeIcon');
    makeToggle('togglePass2', 'passConfirm', 'eyeIcon2');

    // Password strength
    document.getElementById('password').addEventListener('input', function () {
      const val = this.value;
      const fill  = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      const bar   = document.getElementById('strengthBar');

      if (!val) { bar.style.opacity = '0'; return; }
      bar.style.opacity = '1';

      let score = 0;
      if (val.length >= 8)              score++;
      if (/[A-Z]/.test(val))            score++;
      if (/[0-9]/.test(val))            score++;
      if (/[^A-Za-z0-9]/.test(val))     score++;

      const levels = [
        { pct:'20%', color:'#c0574a', text:'Muy débil' },
        { pct:'40%', color:'#d4884a', text:'Débil'     },
        { pct:'65%', color:'#c8aa44', text:'Regular'   },
        { pct:'100%',color:'#6baa6e', text:'Fuerte'    },
      ];
      const lv = levels[score - 1] || levels[0];
      fill.style.width = lv.pct;
      fill.style.background = lv.color;
      label.textContent = lv.text;
      label.style.color = lv.color;
    });

    // Validation
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      let ok = true;

      const fields = {
        firstName:  { el: document.getElementById('firstName'),   err: document.getElementById('firstNameErr'),  msg: 'Ingresa tu nombre.' },
        lastName:   { el: document.getElementById('lastName'),    err: document.getElementById('lastNameErr'),   msg: 'Ingresa tu apellido.' },
        email:      { el: document.getElementById('email'),       err: document.getElementById('emailErr'),      msg: 'Correo inválido.' },
        password:   { el: document.getElementById('password'),    err: document.getElementById('passErr'),       msg: 'Mínimo 8 caracteres.' },
        passConfirm:{ el: document.getElementById('passConfirm'), err: document.getElementById('confirmErr'),    msg: 'Las contraseñas no coinciden.' },
      };

      Object.entries(fields).forEach(([key, f]) => { f.err.textContent = ''; f.el.closest('.input-wrap').classList.remove('error'); });
      document.getElementById('termsErr').textContent = '';

      if (!fields.firstName.el.value.trim()) { fields.firstName.err.textContent = fields.firstName.msg; fields.firstName.el.closest('.input-wrap').classList.add('error'); ok = false; }
      if (!fields.lastName.el.value.trim())  { fields.lastName.err.textContent  = fields.lastName.msg;  fields.lastName.el.closest('.input-wrap').classList.add('error');  ok = false; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(fields.email.el.value)) { fields.email.err.textContent = fields.email.msg; fields.email.el.closest('.input-wrap').classList.add('error'); ok = false; }
      if (fields.password.el.value.length < 8) { fields.password.err.textContent = fields.password.msg; fields.password.el.closest('.input-wrap').classList.add('error'); ok = false; }
      if (fields.passConfirm.el.value !== fields.password.el.value) { fields.passConfirm.err.textContent = fields.passConfirm.msg; fields.passConfirm.el.closest('.input-wrap').classList.add('error'); ok = false; }
      if (!document.getElementById('terms').checked) { document.getElementById('termsErr').textContent = 'Debes aceptar los términos.'; ok = false; }

      if (ok) {
        const btn = document.getElementById('submitBtn');
        btn.classList.add('loading');
        btn.querySelector('.btn-text').textContent = 'Creando cuenta…';
        setTimeout(() => {
          btn.classList.remove('loading');
          btn.querySelector('.btn-text').textContent = 'Crear mi cuenta';
        }, 2000);
      }
    });
  </script>
</body>
</html>

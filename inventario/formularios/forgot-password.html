<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | Less Perfum</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="split-visual">
    <div class="visual-overlay"></div>
    <img src="https://images.unsplash.com/photo-1595777707802-52317d4fdb0c?w=1200&h=1600&fit=crop" alt="Fragancia" class="visual-img">
    <div class="visual-content">
      <a href="../index.html" class="brand-logo">Less <span>Perfum</span></a>
      <blockquote class="visual-quote">Recupera tu acceso y vuelve a oler lo mejor.</blockquote>
    </div>
  </div>

  <div class="split-form">
    <div class="form-container">
      <div class="form-header">
        <p class="form-label">Recuperar contraseña</p>
        <h1 class="form-title">¿Olvidaste tu contraseña?</h1>
        <p class="form-sub">Ingresa tu correo y te enviaremos un enlace para restablecerla.</p>
      </div>

      <form class="auth-form" id="forgotForm" novalidate>
        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email">
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <span class="btn-text">Enviar enlace</span>
          <i class="bi bi-arrow-right btn-arrow"></i>
        </button>

        <p class="form-sub" style="text-align:center;margin-top:1.2rem;">¿Recordaste tu contraseña? <a href="login.html">Inicia sesión</a></p>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('forgotForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Se enviará un enlace de recuperación a tu correo.');
    });
  </script>
</body>
</html>

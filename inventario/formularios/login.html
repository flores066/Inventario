<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Less Perfum — Iniciar sesión</title>
  <link rel="stylesheet" href="login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

  <!-- PANEL VISUAL -->
  <div class="split-visual">
    <div class="visual-overlay"></div>
    <img
      src="https://images.unsplash.com/photo-1595777707802-52317d4fdb0c?w=1200&h=1600&fit=crop"
      alt="Fragancia" class="visual-img">
    <div class="visual-content">
      <a href="../index.html" class="brand-logo">Less <span>Perfum</span></a>
      <blockquote class="visual-quote">
        "El perfume es la forma<br>más íntima del lujo."
      </blockquote>
    </div>
  </div>

  <!-- PANEL FORMULARIO -->
  <div class="split-form">
    <div class="form-container">

      <div class="form-header">
        <p class="form-label">Bienvenido de nuevo</p>
        <h1 class="form-title">Iniciar sesión</h1>
        <p class="form-sub">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
      </div>

      <form class="auth-form" id="loginForm" novalidate>

        <div class="field-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email">
          </div>
          <span class="field-error" id="emailErr"></span>
        </div>

        <div class="field-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
            <button type="button" class="toggle-pass" id="togglePass" tabindex="-1">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
          <span class="field-error" id="passErr"></span>
        </div>

        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" id="remember">
            <span class="checkmark"></span>
            Recordarme
          </label>
          <a href="forgot-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          <span class="btn-text">Entrar</span>
          <i class="bi bi-arrow-right btn-arrow"></i>
        </button>

      </form>

      <div class="divider"><span>o continúa con</span></div>

      <div class="social-btns">
        <button class="btn-social">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
        <button class="btn-social">
          <i class="bi bi-facebook" style="color:#1877F2;font-size:1.1rem;"></i>
          Facebook
        </button>
      </div>

    </div>
  </div>

  <script src="../js/login.js"></script>
</body>
</html>
